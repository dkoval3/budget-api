openapi: 3.1.0
info:
  title: BudgIT API
  version: 1.0.0
  description: |
    Public contract consumed by the BudgIT UI (Next.js server). Source of truth per API
    constitution §IV. The platform skeleton (feature 001) defines only shared components; business
    endpoints are added by later feature specs.

    Conventions every operation follows:
    - Paths start with `/api/v1`, are kebab-case and use plural nouns.
    - JSON fields are camelCase; unknown fields are rejected with 400 `VALIDATION_FAILED`.
    - Money is an integer in minor units with an explicit `currency`.
    - Every response carries `Cache-Control: no-store` and `X-Request-Id`.
    - Every error is `application/problem+json` (see `Problem`).
servers:
  - url: /
security:
  - cognitoUser: []
paths: {}
components:
  securitySchemes:
    cognitoUser:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Amazon Cognito access token for the signed-in user (`token_use=access`), issued to a
        user-facing app client. Service (client-credentials) tokens are rejected.
  headers:
    X-Request-Id:
      description: |
        Request ID. Echoed from the request if it matches `^[A-Za-z0-9._-]{1,64}$`, otherwise
        generated by the API.
      required: true
      schema:
        type: string
        pattern: '^[A-Za-z0-9._-]{1,64}$'
    Cache-Control:
      required: true
      schema:
        type: string
        const: no-store
    Retry-After:
      description: Seconds to wait before retrying, when known.
      schema:
        type: integer
        minimum: 0
  parameters:
    XRequestId:
      name: X-Request-Id
      in: header
      required: false
      description: Optional caller-supplied request ID; replaced if malformed.
      schema:
        type: string
  schemas:
    Problem:
      type: object
      description: RFC 9457 Problem Details with BudgIT extensions.
      required: [type, title, status, code, requestId]
      additionalProperties: false
      properties:
        type:
          type: string
          format: uri-reference
          description: Stable URI per code, e.g. `https://budgit.app/problems/stale-version`.
        title:
          type: string
          description: Short, generic, human-readable summary. Never contains request values.
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          $ref: '#/components/schemas/ProblemCode'
        requestId:
          type: string
        instance:
          type: string
          format: uri-reference
        errors:
          type: array
          description: Per-field validation errors. Field names only, never field values.
          items:
            $ref: '#/components/schemas/FieldError'
    FieldError:
      type: object
      required: [field, code]
      additionalProperties: false
      properties:
        field:
          type: string
          description: JSON pointer-like path of the offending field, e.g. `name` or `lines[2].amount`.
        code:
          type: string
          description: Constraint code, e.g. `REQUIRED`, `TOO_LONG`, `INVALID_FORMAT`, `UNKNOWN_FIELD`.
    ProblemCode:
      type: string
      description: |
        Stable machine-readable error code. New codes may be added (non-breaking for clients
        that treat unknown codes by HTTP status); existing codes are never renamed. See
        `problem-codes.md`.
      enum:
        - VALIDATION_FAILED
        - UNAUTHENTICATED
        - NOT_FOUND
        - METHOD_NOT_ALLOWED
        - NOT_ACCEPTABLE
        - STALE_VERSION
        - ID_CONFLICT
        - PAYLOAD_TOO_LARGE
        - UNSUPPORTED_MEDIA_TYPE
        - BUSINESS_RULE_VIOLATION
        - RATE_LIMITED
        - INTERNAL_ERROR
        - UPSTREAM_FAILED
        - SERVICE_UNAVAILABLE
        - UPSTREAM_TIMEOUT
  responses:
    BadRequest:
      description: Validation failed (shape, format, unknown fields).
      headers:
        X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
        Cache-Control: { $ref: '#/components/headers/Cache-Control' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthenticated:
      description: Missing, invalid or wrong-kind token. One body for every cause.
      headers:
        X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
        Cache-Control: { $ref: '#/components/headers/Cache-Control' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Record does not exist or belongs to another user (indistinguishable).
      headers:
        X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
        Cache-Control: { $ref: '#/components/headers/Cache-Control' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: Stale version (`STALE_VERSION`) or create-ID conflict (`ID_CONFLICT`).
      headers:
        X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
        Cache-Control: { $ref: '#/components/headers/Cache-Control' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    PayloadTooLarge:
      description: Request body over the size limit.
      headers:
        X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
        Cache-Control: { $ref: '#/components/headers/Cache-Control' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    UnsupportedMediaType:
      description: Unsupported request content type.
      headers:
        X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
        Cache-Control: { $ref: '#/components/headers/Cache-Control' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    InternalError:
      description: Unexpected error. Generic body.
      headers:
        X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
        Cache-Control: { $ref: '#/components/headers/Cache-Control' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ServiceUnavailable:
      description: A dependency is temporarily unavailable or the API is shutting down.
      headers:
        X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
        Cache-Control: { $ref: '#/components/headers/Cache-Control' }
        Retry-After: { $ref: '#/components/headers/Retry-After' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
